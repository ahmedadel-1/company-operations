# Local development infrastructure (docs/DEPLOYMENT.md §2-§3). Apps run on the host via `pnpm dev`.
#
#   pnpm env:init   # once: creates .env from .env.example
#   pnpm infra:up   # docker compose --env-file .env -f infra/compose/docker-compose.dev.yml up -d --wait
#
# Images are pinned by tag and digest (docs/DEPENDENCIES.md §6). Ports bind to 127.0.0.1 only.

name: company-ops-dev

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      OPS_APP_DB_PASSWORD: ${OPS_APP_DB_PASSWORD:?set OPS_APP_DB_PASSWORD in .env}
      OPS_MIGRATOR_DB_PASSWORD: ${OPS_MIGRATOR_DB_PASSWORD:?set OPS_MIGRATOR_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Override POSTGRES_HOST_PORT when a local PostgreSQL already listens on 5432.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    networks: [ops-dev]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d company_ops && pg_isready -U postgres -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    networks: [ops-dev]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    restart: unless-stopped
    # Imports infra/docker/keycloak/realms on startup when the realm does not exist yet (a fresh
    # keycloak database). ${VAR} placeholders in the realm file are resolved from the variables below.
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      KC_DEMO_USER_PASSWORD: ${KC_DEMO_USER_PASSWORD:?set KC_DEMO_USER_PASSWORD in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      OIDC_BACKCHANNEL_LOGOUT_URL: ${OIDC_BACKCHANNEL_LOGOUT_URL:?set OIDC_BACKCHANNEL_LOGOUT_URL in .env}
    volumes:
      - ../docker/keycloak/realms:/opt/keycloak/data/import:ro
    # Back-channel logout calls the API running on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Health endpoints stay on the management port 9000 inside the network (not published).
      - '127.0.0.1:8080:8080'
    networks: [ops-dev]
    healthcheck:
      # The image ships without curl; probe /health/ready over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    # `weed mini`: single-node master + volume + filer + S3 gateway (ADR-0008). Creates S3_BUCKET at start.
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    volumes:
      - seaweedfs-data:/data
    ports:
      - '127.0.0.1:8333:8333'
    networks: [ops-dev]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks: [ops-dev]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional LAN HTTPS proxy for phone geolocation testing (DEPLOYMENT §3). Not started by default.
  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    profiles: [proxy]
    restart: unless-stopped
    volumes:
      - ../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    ports:
      - '443:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [ops-dev]

networks:
  ops-dev:
    name: company-ops-dev
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  mailpit-data:
