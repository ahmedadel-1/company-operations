# Development reverse proxy (Compose profile `proxy`): LAN HTTPS so phones get a secure origin for
# geolocation (docs/DEPLOYMENT.md §3). Same-site layout as production: / -> web, /api -> API.
# Production hardening (rate limits, headers) is Phase 9.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 25m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # Server-Sent Events: no buffering, and a read timeout well above the 25 s heartbeat.
  location = /api/v1/notifications/events/stream {
    proxy_pass http://host.docker.internal:4000;
    proxy_http_version 1.1;
    # Any proxy_set_header here replaces the server-level ones, so they are repeated.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://host.docker.internal:4000;
  }

  location / {
    proxy_pass http://host.docker.internal:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
