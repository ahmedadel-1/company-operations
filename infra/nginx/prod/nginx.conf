# Production reverse proxy (docs/DEPLOYMENT.md §4, docs/runbooks/tls-and-proxy.md).
# TLS termination, HTTP/2, coarse per-IP limits in front of the application's own rate limits, request
# size and time limits, SSE pass-through and HSTS. The applications set the remaining security headers
# themselves (web: CSP and friends, API: helmet, Keycloak: its own), so they are not duplicated here.

worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;

  # Slow-client protection. Uploads go directly to object storage (pre-signed URLs), never through here.
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  client_max_body_size 1m;
  client_body_buffer_size 64k;
  large_client_header_buffers 4 16k;

  # Upstream timeouts (locations may raise them, e.g. the SSE stream).
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Writable paths live on tmpfs (read-only root filesystem).
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  # JSON access log without query strings ($uri, not $request_uri): OIDC codes, state and pre-signed
  # signatures never reach the log.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstream_time":"$upstream_response_time","request_id":"$ops_request_id",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # Docker's embedded DNS; upstreams are resolved per request so a restarted container (new address) or
  # a service that is not running yet never stops the proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Coarse per-client limits (the API enforces the fine-grained buckets, ADR-0016).
  limit_req_zone $binary_remote_addr zone=ops_api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=ops_auth:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=ops_idp:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=ops_webhooks:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=ops_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # $request_id (32 random hex digits) shaped as a version-4 UUID, the format the API accepts for
  # X-Request-Id, so one id follows a request through proxy and API logs.
  map $request_id $ops_request_id {
    "~^(?<p1>[0-9a-f]{8})(?<p2>[0-9a-f]{4})[0-9a-f](?<p3>[0-9a-f]{3})[0-9a-f](?<p4>[0-9a-f]{3})(?<p5>[0-9a-f]{12})$" "$p1-$p2-4$p3-8$p4-$p5";
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Mozilla "intermediate" TLS profile (TLS 1.2 + 1.3).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:ops_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/conf.d/*.conf;
}
