# Included by API locations whose callers are programs, not page navigations. A location-level error_page
# replaces every inherited one, so the rate-limit handler is repeated. Only errors nginx generates itself
# (upstream unreachable or timed out) are replaced; API responses pass through unchanged.
error_page 429 = @ops_rate_limited;
error_page 502 503 504 = @ops_api_unavailable;
