# Included by every proxied location (a location-level proxy_set_header replaces all inherited ones).
# X-Forwarded-For is overwritten with the connecting address, never appended: a client-supplied value can
# not reach the applications, and the API (TRUST_PROXY_HOPS=1) uses exactly this entry.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
proxy_set_header X-Request-Id $ops_request_id;
proxy_hide_header X-Powered-By;
